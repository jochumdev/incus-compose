server:
  # subnetcache is the module that reads the scope on a reply. Without it the
  # option is neither sent nor understood, and every answer lands in the one
  # shared cache.
  module-config: "subnetcache validator iterator"

  # The address of the *authority* to attach a client subnet for, not the client
  # space it is taken from. CoreDNS holds a 10.x address whatever /24 the
  # checkout drew, so one line covers every stack.
  send-client-subnet: 10.0.0.0/8

  # The whole address, which is what ecs_view needs to identify a querier - it
  # resolves the address it is given against the hosts it knows. unbound defaults
  # to 24 and 56, which would hand over the querier's network instead: every
  # client on a bridge would collapse into one view, and the per-querier
  # filtering this plugin exists for would be silently gone. dnsmasq's
  # `add-subnet=32,128` is the same statement.
  max-client-subnet-ipv4: 32
  max-client-subnet-ipv6: 128

  # client-subnet-always-forward is left at no on purpose. Clients here send no
  # option of their own, so unbound generates one from the querier address, which
  # is the path `no` covers. Turning it on would forward a client's own asserted
  # subnet and skip the cache lookup - a different deployment, and one where the
  # querier is whatever the client says it is.

  # Subnets kept per name and type, against unbound's default of 100. A view is
  # per /32 here, so a fleet asking one service name from more hosts than this
  # would evict its own entries and read as a cache that does not work.
  max-ecs-tree-size-ipv4: 4096
  max-ecs-tree-size-ipv6: 4096
