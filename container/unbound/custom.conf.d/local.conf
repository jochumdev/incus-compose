server:
  # Three defaults would each turn a working answer into a missing one, and all
  # three are about the fleet living in RFC1918 space.

  # unbound strips private addresses out of answers for public zones, as
  # rebinding protection - and its own default private-address list holds
  # 10.0.0.0/8, which is the whole fleet. Naming the zone exempts it.
  private-domain: "incus."

  # `incus.` is not a delegation any root knows, so the validator can prove only
  # that it does not exist and would answer bogus for every name under it. There
  # is no chain to build here and nothing to validate against.
  domain-insecure: "incus."

  # The reverse zones the plugin serves are RFC1918 space, which unbound answers
  # from built-in local zones by default - a PTR query would never reach the
  # forwarder. The pair removes those zones and marks what replaces them
  # insecure, for the same reason as the line above.
  unblock-lan-zones: yes
  insecure-lan-zones: yes

  # Everything outside the fleet is still resolved from the root, which is what
  # makes this a resolver in front rather than a proxy. Only the zones in
  # forward.conf go to CoreDNS.
