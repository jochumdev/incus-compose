name: dns

x-incus:
  "user.label.dns.scope": "${SUITE_SCOPE}"

secrets:
  token:
    environment: INCUS_TOKEN

services:
  ic-dns:
    image: ghcr.io/lxc/incus-compose/ic-dns:latest
    build:
      context: "${PROJECT_ROOT}"
      dockerfile: container/ic-dns/Containerfile
    networks:
      dns:
        ipv4_address: "${IPV4_IC_DNS}/24"
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 100M
    environment:
      DNS_INCUS: "https://${IPV4_GATEWAY}:${INCUS_PORT}"
      DNS_SECRETS_DIR: /etc/ic-dns
      DNS_DATA_DIR: "${DNS_DATA_DIR}"
      DNS_PROJECT_MARKER: "user.label.dns.scope=${SUITE_SCOPE}"
      DNS_FORWARD: "${IPV4_GATEWAY}:53"
      DNS_HTTP: ":9153"
      DNS_TTL: "5"
      DNS_LOG: "${DNS_LOG:-TRACE}"
    secrets:
      - source: token
        target: /etc/ic-dns/token

networks:
  dns:
    x-incus:
      ipv4.address: "${IPV4_GATEWAY}/24"
      ipv4.nat: true
  shared:
