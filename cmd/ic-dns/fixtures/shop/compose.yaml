name: shop

x-incus:
  "user.label.dns.scope": "project"
  "user.label.dns.zone": "$PROJECT_ZONE:-shop.incus}"

x-container-template: &template
  image: ghcr.io/lxc/incus-compose/debug:latest
  build:
    context: ${PROJECT_ROOT}/container/debug/
    dockerfile: Containerfile
  dns:
    - "${IPV4_IC_DNS}"
  dns_search:
    - ${DNS_SEARCH}
  x-incus:
    limits.cpu: 1

secrets:
  token:
    environment: INCUS_TOKEN

services:
  ic-dns:
    image: ghcr.io/lxc/incus-compose/ic-dns:latest
    build:
      context: "${PROJECT_ROOT}"
      dockerfile: container/ic-dns/Containerfile
    networks:
      dns:
        ipv4_address: "${IPV4_IC_DNS}/24"
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 100M
    environment:
      DNS_INCUS: "https://${IPV4_GATEWAY}:${INCUS_PORT:-8443}"
      DNS_SECRETS_DIR: /etc/ic-dns
      DNS_DATA_DIR: "${DNS_DATA_DIR:-}"
      DNS_PROJECT_MARKER: "user.label.dns.scope=project"
      DNS_FORWARD: "${IPV4_GATEWAY}:53"
      DNS_HTTP: ":9153"
      DNS_TTL: "5"
      DNS_LOG: "${DNS_LOG:-TRACE}"
    secrets:
      - source: token
        target: /etc/ic-dns/token

  gateway:
    <<: *template
    networks:
      gateway:

  users-api:
    <<: *template
    networks:
      gateway:
      users-net:

  users-db:
    <<: *template
    networks:
      users-net:

  products-api:
    <<: *template
    networks:
      gateway:
      products-net:

  products-db:
    <<: *template
    networks:
      products-net:

  delete-me:
    <<: *template
    networks:
      products-net:

networks:
  dns:
    x-incus:
      ipv4.address: "${IPV4_GATEWAY}/24"
      ipv4.nat: true
  gateway:
  users-net:
  products-net:
