name: coredns

# This binary as an Incus instance rather than a host process.
#
# The same rig and the same knobs, built from this working tree. What it is not
# is the deployment guide - see docs/ for that, which mints a trust token and
# pins an address. This one borrows your own incus client identity and exists to
# be started and thrown away.
#
#   just coredns-compose up -d
#
# --os-env is required rather than a convenience, and `just coredns-compose`
# passes it: incus-compose reads .env files only, so without it every variable
# below is empty. Everything here is deliberately an OS variable, the way
# INCUS_REMOTE already is.
#
# There is no Corefile. main composes the chain at compile time and takes its
# configuration from flags and environment, so every knob below is one of
# `coredns run --help` and nothing is mounted to configure it.
#
# INCUS_ENDPOINT is required. The gateway below is this bridge's, and incusd is
# only on it when it happens to listen there.

services:
  # Built from the repository root, so the image under test is this working
  # tree. The context is ../.. because this file lives in cmd/coredns and a
  # build context is relative to the compose file.
  #
  # It has no dns: of its own - it reaches the Incus API by address, and would
  # otherwise be asking itself.
  coredns:
    image: ghcr.io/lxc/incus-compose/coredns:latest
    container_name: coredns
    build:
      context: ../..
      dockerfile: container/coredns/Containerfile

    # entrypoint rather than command: incus-compose has no command, and
    # entrypoint.sh is what sets GOMEMLIMIT from the cgroup limit before handing
    # over. run is the subcommand; everything else is environment.
    entrypoint: ["entrypoint.sh", "run"]

    environment:
      COREDNS_INCUS: "${INCUS_ENDPOINT:?give the Incus HTTPS API, e.g. https://10.0.0.1:8443}"
      COREDNS_LISTEN: ":${COREDNS_PORT-53}"

      # /metrics, /health and /ready. Every interface rather than loopback,
      # because the scraper is outside the instance.
      COREDNS_HTTP: "${COREDNS_HTTP-:9153}"

      # Your own incus client identity, already in the trust store, so nothing
      # is generated and no token is redeemed.
      COREDNS_CLIENT_CERT: /etc/coredns/incus/client.crt
      COREDNS_CLIENT_KEY: /etc/coredns/incus/client.key

      # Records and zone serials survive a restart from here, in the data volume
      # below. `just coredns-cold-stats` reads cold.json straight out of it.
      COREDNS_DATA_DIR: /var/lib/coredns-incus

      # Serves only what the stress scripts stamp. Empty serves every project
      # the certificate can see instead.
      COREDNS_PROJECT_MARKER: "${COREDNS_PROJECT_MARKER-user.coredns.stress}"

      COREDNS_TTL: "${COREDNS_TTL-5}"

      # A plain address; cache and loop go in front of the forwarder in the
      # chain main composes. Never for a benchmark: it turns every unmatched
      # name into upstream traffic, so the run measures the upstream.
      COREDNS_FORWARD: "${COREDNS_FORWARD-}"

      # Echoes the RFC 7871 client subnet back with a scope, for the ECS-aware
      # cache in front. Off by default, as the plugin's own default is.
      COREDNS_ECHO_SUBNET: "${COREDNS_ECHO_SUBNET-}"

      COREDNS_METRICS: "${COREDNS_METRICS-false}"

      # /debug/pprof on the metrics port, for finding where a query's time goes
      # when the wire number and the in-process one disagree. Off by default,
      # and it takes the HTTP write timeout off with it - so this is a knob for
      # a rig, not for a deployment.
      COREDNS_PPROF: "${COREDNS_PPROF-}"

      # A line per event, and per query. Off by default: it is loud, and a
      # benchmark measuring the logger is measuring the wrong thing.
      COREDNS_DEBUG: "${COREDNS_DEBUG-}"

    # Pinned, so a client can be pointed at it before the stack is up and a
    # benchmark's SERVER does not have to be read back out of Incus. It sits
    # below the DHCP range incus-compose derives for a network with an explicit
    # address, which on a /24 starts at .64.
    networks:
      default:
        ipv4_address: "${IPV4_COREDNS}/24"

    # Live heap is 6 MB for a 480-instance fleet. The rest of what cgroup2
    # charges is anon the Go runtime has not returned, the binary's text as page
    # cache, kernel stacks and socket buffers - so this is headroom rather than
    # a fit.
    #
    # cpus is cores, as compose-spec defines it, and incus-compose turns it into
    # a hard quota rather than a cpuset. That is the form the Go runtime can
    # see: entrypoint.sh sizes GOMAXPROCS from cpu.max.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 100M

    secrets:
      - source: client-crt
        target: /etc/coredns/incus/client.crt
      - source: client-key
        target: /etc/coredns/incus/client.key

    volumes:
      - data:/var/lib/coredns-incus

  # An ECS-aware cache in front of coredns, and the only consumer the RFC 7871
  # scope has. It answers beside coredns rather than instead of it, so a run
  # names which one it asked:
  #
  #   COREDNS_ECHO_SUBNET=1 just coredns-compose up -d
  #   just coredns-verify-dns -u
  #
  # Run it with COREDNS_ECHO_SUBNET empty and it is the bug the scope exists to
  # prevent, reproduced: no option on the reply reads as "not tailored", so
  # unbound files the answer in its regular cache and serves one querier's view
  # to the next one to ask.
  unbound:
    image: ghcr.io/lxc/incus-compose/unbound:latest
    container_name: unbound
    build:
      context: ../../container/unbound
      dockerfile: Containerfile
    networks:
      default:
        ipv4_address: "${IPV4_UNBOUND}/24"
    configs:
      - source: unbound-forward
        target: /etc/unbound/custom.conf.d/forward.conf
        mode: 0o444

  # Where a check or a benchmark runs from. It sits on the same network as
  # coredns, inside the same daemon, so it asks over the wire the fleet's own
  # clients ask over. Driving dnsperf from the host would measure whatever is
  # between here and there, and a remote daemon has no route back at all.
  #
  # sleep rather than the image's shell: an application container with no tty
  # exits the moment that does, and this one has to be there to exec into.
  debug:
    image: ghcr.io/lxc/incus-compose/debug:latest
    container_name: debug
    build:
      context: ../../container/debug
      dockerfile: Containerfile
    entrypoint: ["sleep", "infinity"]

configs:
  # The zones CoreDNS is authoritative for, and nothing else - unbound resolves
  # the rest from the root, which is what makes it a resolver in front rather
  # than a proxy. Rendered here rather than baked into the image because the
  # address is the stack's, and the /24 is drawn per checkout.
  #
  # 10.in-addr.arpa. covers every reverse zone, since the fleet is 10.x
  # throughout.
  unbound-forward:
    content: |
      forward-zone:
        name: "incus."
        forward-addr: ${IPV4_COREDNS}

      forward-zone:
        name: "10.in-addr.arpa."
        forward-addr: ${IPV4_COREDNS}

secrets:
  client-crt:
    file: $HOME/.config/incus/client.crt
  client-key:
    file: $HOME/.config/incus/client.key

volumes:
  # Named data, and read back as vol-data by `just coredns-cold-stats`. It is
  # the only thing in this stack that outlives a down: the certificate is
  # borrowed and the records can be re-read, but the zone serials cannot be
  # recovered from anywhere.
  data:

networks:
  default:
    x-incus:
      # An explicit address, which is what lets coredns pin one - and what makes
      # incus-compose derive a DHCP range that leaves room below it. nat has to
      # be said out loud with it: Incus turns it on by itself only for a subnet
      # it drew, so an explicit one without this line has no route out.
      ipv4.address: "${IPV4_GATEWAY}/24"
