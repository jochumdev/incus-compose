name: Test E2E

on:
  pull_request:
  workflow_dispatch:

# The self-hosted runners share the ict-* remotes, so only one run at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # https://stackoverflow.com/a/79780883/3368468
  GOTOOLCHAIN: "go1.26.0+auto"
  REPORTS_DIR: reports

jobs:
  test-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            remote: ict-stable
          - name: custom
            remote: ict-custom
          # - name: lts
          #   remote: ict-lts
          - name: daily
            remote: ict-daily
    runs-on: [self-hosted, incus-compose, default]
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write # publish JUnit results as a check run
    env:
      INCUS_REMOTE: ${{ matrix.remote }}
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      NO_COLOR: 1
      INCUS_COMPOSE_TEST_E2E: 1
      # testlib builds the CLI with -cover and points the subprocess here.
      INCUS_COMPOSE_TEST_COVERDIR: ${{ github.workspace }}/reports/covdata
      INCUS_COMPOSE_UP_DEPENDENCY_TIMEOUT: "5m"
      INCUS_COMPOSE_UP_TIMEOUT: "5m"
      INCUS_COMPOSE_DOWN_TIMEOUT: "2m"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_HEALTHD_IMAGE=ghcr.io/lxc/incus-compose/ic-healthd:${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_INIT_IMAGE=ghcr.io/lxc/incus-compose/ic-sleep:${short}" >> "$GITHUB_ENV"

      - name: Build healthd
        run: |
          echo "Using healthd image: ${INCUS_COMPOSE_HEALTHD_IMAGE}"
          just run -P cmd/ic-healthd build --os-env
          just run healthd down --force || true

      - name: Build ic-sleep
        run: |
          echo "Using tools image: ${INCUS_COMPOSE_INIT_IMAGE}"
          just run -P cmd/ic-sleep build --os-env

      - name: Test
        run: |
          mkdir -p "$REPORTS_DIR" "$INCUS_COMPOSE_TEST_COVERDIR"

          gotestsum \
            --packages="./..." \
            --junitfile "$REPORTS_DIR/junit.xml" \
            --jsonfile="$REPORTS_DIR/test.json" \
            --post-run-command "bash -c 'echo; echo Slowest tests; gotestsum tool slowest --num=10 --jsonfile=$REPORTS_DIR/test.json'" \
            -- -count=1 -parallel "$TEST_PROCS" -timeout 20m \
               -cover -covermode=atomic -coverpkg ./... -v \
               -args -test.gocoverdir="$INCUS_COMPOSE_TEST_COVERDIR" 2>&1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Go Tests (${{ matrix.name }})
          path: ${{ env.REPORTS_DIR }}/junit.xml
          reporter: java-junit
          fail-on-error: false

      # always(), or a failing suite reports no coverage at all.
      - name: Publish coverage
        if: always()
        run: |
          go tool covdata textfmt -i="$INCUS_COMPOSE_TEST_COVERDIR" -o "$REPORTS_DIR/cover.out"

          {
            echo '# Coverage'
            echo
            echo '```'
            just cover "$REPORTS_DIR/cover.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-example:
    needs: test-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hugo
            args: "-run TestExample/hugo"
            remote: ict-stable
          - name: Leafwiki
            args: "-run TestExample/leafwiki"
            remote: ict-custom
          # - name: Immich
          #   args: "-run TestExample/immich -timeout 20m"
          #   remote: ict-lts
          # - name: ManyDependencies
          #   args: "-run TestExample/many-dependencies"
          #   remote: ict-daily
          - name: WikiJS
            args: "-run TestExample/wikijs"
            remote: ict-daily
    runs-on: [self-hosted, incus-compose]
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # publish JUnit results as a check run
    env:
      INCUS_REMOTE: ${{ matrix.remote }}
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      NO_COLOR: 1
      INCUS_COMPOSE_TEST_EXAMPLES: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_HEALTHD_IMAGE=ghcr.io/lxc/incus-compose/ic-healthd:${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_INIT_IMAGE=ghcr.io/lxc/incus-compose/ic-sleep:${short}" >> "$GITHUB_ENV"

      - name: Build healthd
        run: |
          echo "Using healthd image: ${INCUS_COMPOSE_HEALTHD_IMAGE}"
          just run -P cmd/ic-healthd build --os-env
          just run healthd down --force || true

      - name: Build ic-sleep
        run: |
          echo "Using tools image: ${INCUS_COMPOSE_INIT_IMAGE}"
          just run -P cmd/ic-sleep build --os-env

      - name: Test
        run: |
          mkdir -p "$REPORTS_DIR"

          gotestsum \
            --packages="./examples/..." \
            --junitfile "$REPORTS_DIR/junit.xml" \
            -- -count=1 -parallel "$TEST_PROCS" -timeout 20m \
               ${{ matrix.args }} 2>&1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Go Tests (${{ matrix.name }})
          path: ${{ env.REPORTS_DIR }}/junit.xml
          reporter: java-junit
          fail-on-error: false
