name: Test E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://stackoverflow.com/a/79780883/3368468
  GOTOOLCHAIN: "go1.26.0+auto"
  REPORTS_DIR: reports

jobs:
  test-e2e:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stable
            remote: ict-stable
          - name: custom
            remote: ict-custom
          - name: lts
            remote: ict-lts
          - name: daily
            remote: ict-daily
    runs-on: [self-hosted, incus-compose, default]
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write # publish JUnit results as a check run
    env:
      INCUS_REMOTE: ${{ matrix.remote }}
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      NO_COLOR: 1
      INCUS_COMPOSE_TEST_E2E: 1
      INCUS_COMPOSE_UP_DEPENDENCY_TIMEOUT: "5m"
      INCUS_COMPOSE_UP_TIMEOUT: "5m"
      INCUS_COMPOSE_DOWN_TIMEOUT: "2m"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_HEALTHD_IMAGE=ghcr.io/lxc/incus-compose/ic-healthd:${short}" >> "$GITHUB_ENV"

      - name: Build healthd
        run: |
          echo "Using healthd image: ${INCUS_COMPOSE_HEALTHD_IMAGE}"
          just run -P cmd/ic-healthd build --os-env
          just run healthd down --force || true

      - name: Test
        run: |
          mkdir -p "$REPORTS_DIR"

          gotestsum \
            --packages="./..." \
            --junitfile "$REPORTS_DIR/junit.xml" \
            --jsonfile="$REPORTS_DIR/test.json" \
            --post-run-command "bash -c 'echo; echo Slowest tests; gotestsum tool slowest --num=10 --jsonfile=$REPORTS_DIR/test.json'" \
            -- -count=1 -parallel "$TEST_PROCS" -timeout 20m \
               -covermode=atomic -coverprofile="$REPORTS_DIR/cover.out" -v 2>&1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Go Tests (${{ matrix.name }})
          path: ${{ env.REPORTS_DIR }}/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish coverage
        if: always()
        run: |
          echo -e '# Coverage\n' >> $GITHUB_STEP_SUMMARY
          go tool cover -func="$REPORTS_DIR/cover.out" >> $GITHUB_STEP_SUMMARY

  test-example:
    needs: test-e2e
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Hugo
            args: "-run TestExample/hugo"
          - name: Leafwiki
            args: "-run TestExample/leafwiki"
          - name: Immich
            args: "-run TestExample/immich -timeout 20m"
          # - name: ManyDependencies
          #   args: "-run TestExample/many-dependencies"
          - name: WikiJS
            args: "-run TestExample/wikijs"
    runs-on: [self-hosted, incus-compose]
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # publish JUnit results as a check run
    env:
      INCUS_REMOTE: ict-daily
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      NO_COLOR: 1
      INCUS_COMPOSE_TEST_EXAMPLES: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_HEALTHD_IMAGE=ghcr.io/lxc/incus-compose/ic-healthd:${short}" >> "$GITHUB_ENV"

      - name: Build healthd
        run: |
          echo "Using healthd image: ${INCUS_COMPOSE_HEALTHD_IMAGE}"
          just run -P cmd/ic-healthd build --os-env
          just run healthd down --force || true

      - name: Test
        run: |
          mkdir -p "$REPORTS_DIR"

          gotestsum \
            --packages="./examples/..." \
            --junitfile "$REPORTS_DIR/junit.xml" \
            -- -count=1 -parallel "$TEST_PROCS" -timeout 20m \
               ${{ matrix.args }} 2>&1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Go Tests (${{ matrix.name }})
          path: ${{ env.REPORTS_DIR }}/junit.xml
          reporter: java-junit
          fail-on-error: false

