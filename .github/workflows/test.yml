name: Test

on:
  pull_request:

env:
  # https://stackoverflow.com/a/79780883/3368468
  GOTOOLCHAIN: "go1.26.0+auto"
  REPORTS_DIR: reports

jobs:
  lint:
    runs-on: [self-hosted, incus-compose]
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: shellcheck **/*.sh
        run: shellcheck **/*.sh

      - name: go mod tidy -diff
        run: go mod tidy -v -diff

      - name: golangci-lint
        # Writes the SARIF file even when issues are found, then exits non-zero.
        run: golangci-lint run --output.sarif.path=gl-code-quality-report.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gl-code-quality-report.sarif
          category: golangci-lint

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            remote: ict-stable
          - name: custom
            remote: ict-custom
          - name: lts
            remote: ict-lts
          - name: daily
            remote: ict-daily
    runs-on: [self-hosted, incus-compose, default]
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write # publish JUnit results as a check run
    env:
      INCUS_REMOTE: ${{ matrix.remote }}
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      VERSION: "${{ github.sha }}"
      # testlib builds the CLI with -cover and points the subprocess here.
      INCUS_COMPOSE_TEST_COVERDIR: ${{ github.workspace }}/reports/covdata

      NO_COLOR: 1
      INCUS_COMPOSE_UP_DEPENDENCY_TIMEOUT: "5m"
      INCUS_COMPOSE_UP_TIMEOUT: "5m"
      INCUS_COMPOSE_DOWN_TIMEOUT: "2m"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"
          echo "INCUS_COMPOSE_HEALTHD_IMAGE=ghcr.io/lxc/incus-compose/ic-healthd:${short}" >> "$GITHUB_ENV"

      - name: Build healthd
        run: |
          echo "Using healthd image: ${INCUS_COMPOSE_HEALTHD_IMAGE}"
          just run -P cmd/ic-healthd build --os-env
          just run healthd down --force || true

      - name: Test
        run: |
          mkdir -p "$INCUS_COMPOSE_TEST_COVERDIR"

          gotestsum \
            --packages="./..." \
            --junitfile="$REPORTS_DIR/junit.xml" \
            --jsonfile="$REPORTS_DIR/test.json" \
            --post-run-command "bash -c 'echo; echo Slowest tests; gotestsum tool slowest --num=10 --jsonfile=$REPORTS_DIR/test.json'" \
            -- -count=1 -parallel "$TEST_PROCS" \
            -cover -covermode=atomic -v \
            -args -test.gocoverdir="$INCUS_COMPOSE_TEST_COVERDIR" 2>&1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Go Tests (${{ matrix.name }})
          path: ${{ env.REPORTS_DIR }}/junit.xml
          reporter: java-junit
          fail-on-error: false

      # always(), or a failing suite reports no coverage at all.
      - name: Publish coverage
        if: always()
        run: |
          go tool covdata textfmt -i="$INCUS_COMPOSE_TEST_COVERDIR" -o "$REPORTS_DIR/cover.out"

          {
            echo '# Coverage'
            echo
            echo '```'
            just cover "$REPORTS_DIR/cover.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
