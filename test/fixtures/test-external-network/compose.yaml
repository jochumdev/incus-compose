# An external network lives in the default project, so this project stays out
# of features.networks to reach it.
x-incus:
  features.networks: "false"

services:
  web:
    image: docker.io/alpine:edge
    x-incus:
      limits.cpu: 1
    networks:
      - br0

networks:
  br0:
    external: true
    x-incus-compose:
      network: incusbr0
