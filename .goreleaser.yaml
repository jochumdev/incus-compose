# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

builds:
  - id: "incus-compose"
    main: ./cmd/incus-compose
    binary: incus-compose
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lxc/incus-compose/cmd/incus-compose/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0

  - id: "ic-healthd"
    main: ./cmd/ic-healthd
    binary: ic-healthd
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
      - riscv64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

  - id: "ic-dns"
    main: ./cmd/ic-dns
    binary: ic-dns
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
      - riscv64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

  - id: "ic-sleep"
    main: ./cmd/ic-sleep
    binary: ic-sleep
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
      - riscv64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - id: "incus-compose"
    ids:
      - "incus-compose"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - id: ic-healthd
    ids:
      - "ic-healthd"
    dockerfile: container/ic-healthd/Containerfile.goreleaser
    build_args:
      VERSION: "{{ .Version }}"
    images:
      - "ghcr.io/lxc/incus-compose/ic-healthd"
    tags:
      - "{{ .Version }}"
    annotations:
      "org.opencontainers.image.description": "incus-compose - ic-healthd"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/ppc64le
      - linux/s390x
      - linux/riscv64

  - id: ic-dns
    ids:
      - "ic-dns"
    dockerfile: container/ic-dns/Containerfile.goreleaser
    build_args:
      VERSION: "{{ .Version }}"
    images:
      - "ghcr.io/lxc/incus-compose/ic-dns"
    tags:
      - "{{ .Version }}"
    annotations:
      "org.opencontainers.image.description": "incus-compose - ic-dns"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/ppc64le
      - linux/s390x
      - linux/riscv64

  - id: ic-sleep
    ids:
      - "ic-sleep"
    dockerfile: container/ic-sleep/Dockerfile.goreleaser
    images:
      - "ghcr.io/lxc/incus-compose/ic-sleep"
    tags:
      - "{{ .Version }}"
    annotations:
      "org.opencontainers.image.description": "incus-compose - ic-sleep"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/ppc64le
      - linux/s390x
      - linux/riscv64

release:
  # Never publish straight from a tag push; the release is published by hand.
  draft: true
  # Marks the release pre-release when the tag carries a semver pre-release part.
  prerelease: auto
